services:
  - type: web
    name: hptech-platform-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install --requirement requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/readiness
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: HPTECH Platform
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://app.hptechinformatica.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_PUBLIC_URL
        value: https://app.hptechinformatica.com
      - key: USER_INVITATION_TTL_HOURS
        value: "24"
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "60"
